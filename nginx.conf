error_log /dev/stderr crit;
set_real_ip_from 10.42.0.0/16;
set_real_ip_from 10.0.0.0/24;
real_ip_header X-Real-IP;
real_ip_recursive off;

map $http_cf_connecting_ip $rate_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

map $host $aster_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://js.stripe.com https://m.stripe.network; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.astermail.org https://aster-wallpapers.pages.dev; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://aster-wallpapers.pages.dev wss://calendar.astermail.org wss://cal.astermail.org wss://calendar.aster.cx wss://cal.aster.cx https://challenges.cloudflare.com https://api.stripe.com https://m.stripe.network https://relay.astermail.org; frame-src https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com https://app.astermail.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-to aster-csp; report-uri https://astermail.org/api/reports/v1/csp";
}

map $host $aster_permissions_policy {
    default "geolocation=(), microphone=(), camera=(), payment=(self), usb=(), serial=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=(), browsing-topics=(), fullscreen=(self)";
}

map $host $aster_reporting_endpoints {
    default "aster-csp=\"https://astermail.org/api/reports/v1/csp\"";
}

limit_req_zone $rate_limit_key zone=api_limit:10m rate=30r/s;
limit_req_zone $rate_limit_key zone=auth_limit:10m rate=5r/s;
limit_req_zone $rate_limit_key zone=ws_limit:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "$aster_permissions_policy" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy $aster_csp always;
    add_header Reporting-Endpoints $aster_reporting_endpoints always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    location = /.well-known/change-password {
        return 302 https://app.astermail.org/forgot-password;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        return 200 'ok';
    }

    location = /api/health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        return 200 'ok';
    }

    location = /api/core/v1/auth/me/profile-picture {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 12m;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    location /api/core/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 256 64k;
        proxy_busy_buffers_size 1m;
        proxy_max_temp_file_size 0;
        gzip_comp_level 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 1m;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    location ~ ^/api/mail/v1/messages/[^/]+/envelope-migrate$ {
        return 410;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 256 64k;
        proxy_busy_buffers_size 1m;
        proxy_max_temp_file_size 0;
        gzip_comp_level 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 70m;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    location /ws {
        limit_req zone=ws_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_buffering off;
        gzip off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    location ~* (?:sw|workbox-[a-f0-9]+)\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        error_page 404 = @stale_asset;

        location ~ ^/assets/.+\.map$ {
            error_page 404 = @source_map_denied;
            return 404;
        }

        location ~ ^/assets/.+\.m?js$ {
            error_page 404 = @missing_module;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-XSS-Protection "0" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "$aster_permissions_policy" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy $aster_csp always;
            add_header Reporting-Endpoints $aster_reporting_endpoints always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
            try_files $uri =404;
        }

        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|m?js|woff2?|svg|png|jpg|jpeg|gif|ico|webp|webmanifest|mp3)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        try_files $uri =404;
    }

    location ~* \.map$ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        return 404;
    }

    location @source_map_denied {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        return 404;
    }

    location @missing_module {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Aster-Stale-Asset "1" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        default_type application/javascript;
        return 404 "";
    }

    location @stale_asset {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Aster-Stale-Asset "1" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        default_type text/plain;
        return 404 "";
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        default_type application/json;
        try_files $uri =404;
    }

    location = /session_bridge.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors https://app.astermail.org; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "$aster_permissions_policy" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $aster_csp always;
        add_header Reporting-Endpoints $aster_reporting_endpoints always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
