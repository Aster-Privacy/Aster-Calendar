version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch
    ignore:
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "@noble/curves"
        update-types:
          - version-update:semver-major
      - dependency-name: "@capacitor/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: ml-kem
        versions:
          - ">=0.3"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
